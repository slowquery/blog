# playstyle Argo CD가 devtool Gateway hosts를 관리하므로 blog 도메인은 별도 Gateway
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: blog
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: imustdo.work
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - imustdo.work
        - www.imustdo.work

name: Build and Push to Harbor

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: image.registry.playstyle.lol
  PROJECT: blog
  IMAGE_NAME: application

jobs:
  version:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      short_sha: ${{ steps.out.outputs.short_sha }}
      commit_sha: ${{ steps.out.outputs.commit_sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semver
        id: semver
        run: |
          chmod +x deploy/scripts/compute-semver-bump.sh deploy/scripts/bump-package-version.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="$(bash deploy/scripts/compute-semver-bump.sh)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Bump package.json and tag (push only)
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "${CURRENT}" != "${VERSION}" ]; then
            bash deploy/scripts/bump-package-version.sh "${VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git push
          fi
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Export outputs
        id: out
        run: |
          echo "version=${{ steps.semver.outputs.version }}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && needs.version.outputs.commit_sha || github.sha }}

      - name: Configure Docker insecure registry
        run: |
          echo '{"insecure-registries":["image.registry.playstyle.lol"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SHORT_SHA="${{ needs.version.outputs.short_sha }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:${VERSION}-${SHORT_SHA},${IMAGE}:latest" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/application.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-bump:
    needs:
      - version
      - build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync with master
        run: git pull --rebase origin master

      - name: Update deploy image tags
        run: |
          chmod +x deploy/scripts/update-image-tags.sh
          bash deploy/scripts/update-image-tags.sh "${{ needs.version.outputs.version }}"

      - name: Commit and push deploy values
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/application/values.yaml
          if git diff --staged --quiet; then
            echo "No deploy tag changes"
            exit 0
          fi
          git commit -m "chore(deploy): bump images to v${VERSION} [skip ci]"
          git push

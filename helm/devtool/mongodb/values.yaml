# Bitnami mongodb subchart overrides (chart 19.1.6)
# 비밀번호: npm run helm:devtool:secrets → mongodb/values.secrets.yaml
mongodb:
  auth:
    rootUser: root
    usernames:
      - antiweb
    databases:
      - blog
  architecture: standalone
  persistence:
    enabled: true
    size: 8Gi
  resourcesPreset: nano
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi
